<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3390ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chat">
<meta name="mobile-web-app-capable" content="yes">
<title>Chat Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --b:#3390ec;--b2:#2b7fd4;--bg:#f2f3f5;--card:#fff;--txt:#1f2429;
  --m:#8b939b;--bd:#e6e8ea;--in:#f1f3f5;--my:#dff0ff;--shadow:0 1px 3px rgba(0,0,0,.08);
}
html[data-theme="dark"]{
  --bg:#14181c;--card:#1e242b;--txt:#e8edf2;--m:#8d98a3;--bd:#2d363f;
  --in:#262f38;--my:#24445e;--shadow:0 1px 3px rgba(0,0,0,.4);
}
/* AMOLED: чистый чёрный — пиксели реально выключены */
html[data-theme="amoled"]{
  --bg:#000;--card:#000;--txt:#f5f5f5;--m:#828282;--bd:#171717;
  --in:#0a0a0a;--my:#001522;--shadow:none;
}
html[data-theme="dark"] .center,html[data-theme="amoled"] .center{background:#000}
html[data-theme="amoled"] .msgs{background-image:none}
html[data-theme="amoled"] .bub{background:#050505}
html[data-theme="amoled"] .bub.mine{background:#001522}
html[data-theme="amoled"] .avatar{background:#111}
html[data-theme="amoled"] .avatar.sm{background:#151515}
html[data-theme="amoled"] .topbar,html[data-theme="amoled"] .tabbar,html[data-theme="amoled"] .chat-head,html[data-theme="amoled"] .composer{border-color:#101010}
html[data-theme="amoled"] .switch{background:#202020}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--txt);background:var(--bg);overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Общие ---------- */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--b);color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
.btn.sec{background:var(--in);color:var(--txt)}
.inp{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:11px;background:var(--card);outline:none}
.inp:focus{border-color:var(--b)}
.hint{font-size:11.5px;color:var(--m);line-height:1.4}
.code-warning{color:#e34d4d;font-weight:700;font-size:12px;line-height:1.45;text-align:center;margin:10px 0;padding:9px 10px;background:rgba(227,77,77,.09);border-radius:10px}
.err{color:#e34d4d;font-size:12.5px;min-height:17px}
.avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#8fd0ff,#4fa8f5);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;position:relative
}
.avatar.sm{width:36px;height:36px;font-size:14px}
.dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#3aca6d;border:2px solid var(--card)}
.muted{color:var(--m)}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}

/* ---------- Настройка / вход ---------- */
.auth-box{width:100%;max-width:390px;padding:26px 20px}
.logo{font-size:44px;text-align:center}
.auth-box h1{text-align:center;font-size:22px;margin:6px 0 16px}
.tabs{display:flex;gap:5px;background:var(--in);padding:4px;border-radius:11px;margin-bottom:15px}
.tabs button{flex:1;padding:9px;border-radius:8px;color:var(--m);font-weight:600;font-size:13px}
.tabs button.on{background:var(--card);color:var(--b);box-shadow:var(--shadow)}
.field{display:flex;align-items:center;border:1px solid var(--bd);border-radius:11px;background:var(--card);padding-left:13px;margin-bottom:10px}
.field:focus-within{border-color:var(--b)}
.field span{color:var(--m);font-size:15px}
.field input{border:0;outline:none;background:none;padding:12px 8px;flex:1;min-width:0}
.eye{padding:0 12px;color:var(--m);font-size:13px}
.link{color:var(--b);font-size:12.5px;margin-top:12px}

/* ---------- Главный экран ---------- */
.main{flex:1;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.topbar .title{flex:1;font-weight:700;font-size:17px}
.iconbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--in);font-size:16px}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg,.tabbar .ic svg,.composer svg,.msgmenu svg,.settings-row svg,.replybar svg,.fab svg,.avatar svg{width:20px;height:20px;display:block}
.tabbar .ic svg{width:22px;height:22px}
.logo svg{width:48px;height:48px}
.msgmenu button,.actions button{display:flex;align-items:center;gap:9px}
.msgmenu button svg{width:19px;height:19px;color:var(--b)}
.msgmenu button[data-act="delete"] svg{color:#e34d4d}
.tabbar{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;padding:9px 0 7px;color:var(--m);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--b)}
.tabbar .ic{font-size:19px;line-height:1}
.badge{background:#e34d4d;color:#fff;border-radius:9px;font-size:9px;padding:1px 5px;position:absolute;top:2px;right:22%}

/* чаты */
.searchbar{padding:10px 14px 4px}
.searchbar input{background:var(--in);border:0;border-radius:11px;padding:10px 14px;width:100%;outline:none;font-size:13px}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.row{display:flex;align-items:center;gap:11px;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--bd)}
.row:active{background:var(--in)}
.row .info{flex:1;min-width:0}
.row .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px}
.row .p{font-size:12.5px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .t{font-size:10px;color:var(--m);align-self:flex-start;margin-top:3px}
.unread{background:var(--b);color:#fff;border-radius:10px;min-width:19px;height:19px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:5px}
.fab{position:absolute;right:18px;bottom:84px;width:52px;height:52px;border-radius:50%;background:var(--b);color:#fff;font-size:26px;box-shadow:0 5px 16px rgba(51,144,236,.45);z-index:3}

/* чат */
.chat{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.chat-head{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.chat-head .nm{font-weight:600;font-size:15px}
.chat-head .st{font-size:11px;color:var(--m)}
.msgs{flex:1;overflow-y:auto;padding:12px 11px;overscroll-behavior:contain}
.date{text-align:center;margin:10px 0}
.date span{background:var(--in);color:var(--m);font-size:10px;padding:4px 10px;border-radius:10px}
.bub{max-width:82%;background:var(--card);padding:8px 11px;border-radius:13px 13px 13px 4px;box-shadow:var(--shadow);margin-bottom:7px}
.bub.mine{margin-left:auto;background:var(--my);border-radius:13px 13px 4px 13px}
.bub .au{color:var(--b);font-size:11px;font-weight:600;margin-bottom:2px}
.bub .tx{font-size:14px;line-height:1.42;white-space:pre-wrap;word-break:break-word}
.bub .tm{font-size:9px;color:var(--m);text-align:right;margin-top:2px}
.typing-bubble{font-size:11px;color:var(--m);margin:2px 0 8px 4px;height:14px}
.composer{display:flex;align-items:flex-end;gap:7px;padding:8px 10px;background:var(--card);border-top:1px solid var(--bd)}
.composer textarea{flex:1;resize:none;max-height:100px;min-height:40px;padding:10px 13px;border:1px solid var(--bd);border-radius:20px;background:var(--card);outline:none;font-size:14px;line-height:1.3}
.composer textarea:focus{border-color:var(--b)}
.send{width:40px;height:40px;border-radius:50%;background:var(--b);color:#fff;font-size:17px;flex-shrink:0}
.send:disabled{opacity:.45}
.emoji{width:34px;height:40px;font-size:20px;flex-shrink:0}
.emoji-panel{display:flex;flex-wrap:wrap;gap:3px;padding:7px 10px;background:var(--card);border-top:1px solid var(--bd);max-height:120px;overflow-y:auto}
.emoji-panel button{font-size:21px;padding:3px}

.bub .reply{border-left:2px solid var(--b);padding-left:7px;margin-bottom:5px;background:rgba(51,144,236,.07);border-radius:4px}
.bub .ra{color:var(--b);font-size:11px;font-weight:600}
.bub .rt{font-size:11.5px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.bub.del .tx{color:var(--m);font-style:italic}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 2px}
.rx{background:var(--in);border-radius:11px;padding:2px 7px;font-size:12px}
.rx.on{background:var(--b);color:#fff}
.checks{color:var(--m);font-size:11px}
.checks.read{color:var(--b)}
.replybar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--in);font-size:12px}
.replybar .rb{flex:1;min-width:0}
.replybar .ra{color:var(--b);font-weight:600}
.replybar .rt{color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgmenu{padding:6px 0}
.msgmenu button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:14px}
.msgmenu button:active{background:var(--in)}
.emoji-quick{display:flex;gap:8px;padding:8px 14px;justify-content:center;font-size:24px}

/* модалка */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:18px;max-height:82vh;overflow-y:auto}
.sheet h3{margin-bottom:12px;font-size:17px}
.sheet .sub{font-size:12px;color:var(--m);margin:14px 0 5px}
.sheet label{display:flex;align-items:center;gap:9px;padding:9px 2px;font-size:14px}
.actions{display:flex;gap:9px;margin-top:16px}
.actions button{flex:1;padding:12px;border-radius:11px;font-weight:600}
.actions .sec{background:var(--in);color:var(--txt)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--bd);font-size:14px}
.settings-row>span:first-child{display:flex;align-items:center;gap:9px}
.switch{width:42px;height:24px;border-radius:13px;background:var(--bd);position:relative;transition:.2s}
.switch::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--b)}
.switch.on::after{left:21px}

/* ===== ДИЗАЙН-ПОЛИРОВКА ===== */
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.btn{background:linear-gradient(135deg,var(--b),var(--b2));box-shadow:0 6px 18px rgba(51,144,236,.28);transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97);box-shadow:0 3px 9px rgba(51,144,236,.2)}
.card{box-shadow:0 8px 28px rgba(31,45,61,.07),0 1px 2px rgba(0,0,0,.03)}

/* фон экрана входа */
html[data-theme="light"] .center{
  background:radial-gradient(1100px 620px at 5% -15%,#cfe8ff,transparent 62%),
             radial-gradient(900px 520px at 110% 115%,#e2d4ff,transparent 58%),#eef4ff;
  position:relative;overflow:hidden;
}
.center::before,.center::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(6px)}
.center::before{width:300px;height:300px;top:-110px;left:-70px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(120,190,255,.3));animation:floatA 9s ease-in-out infinite}
.center::after{width:260px;height:260px;bottom:-110px;right:-70px;background:radial-gradient(circle at 60% 40%,rgba(255,255,255,.8),rgba(167,139,250,.28));animation:floatB 11s ease-in-out infinite}
.center>*{position:relative;z-index:1}
@keyframes floatA{50%{transform:translate(35px,28px) scale(1.12)}}
@keyframes floatB{50%{transform:translate(-30px,-24px) scale(1.08)}}
.auth-box{border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(16px);box-shadow:0 22px 60px rgba(31,76,140,.17)}
.logo{color:var(--b);filter:drop-shadow(0 6px 12px rgba(51,144,236,.28))}

/* аватары и шапки */
.avatar{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 12px rgba(51,144,236,.22)}
.dot{box-shadow:0 0 0 2px var(--card),0 0 8px rgba(58,202,109,.7);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--card),0 0 14px rgba(58,202,109,.95)}}
.topbar,.chat-head{backdrop-filter:blur(14px)}

/* нижняя навигация */
.tabbar button{transition:color .2s}
.tabbar button.on .ic{background:rgba(51,144,236,.14);border-radius:12px;padding:3px 12px}

/* список чатов */
.row{border-radius:14px;margin:2px 8px;width:calc(100% - 16px);transition:background .15s,transform .1s}
.row:active{transform:scale(.992)}
.row.active{background:rgba(51,144,236,.1)}
.unread{background:linear-gradient(135deg,#ff5f6d,var(--b));box-shadow:0 2px 7px rgba(255,95,109,.3)}
.searchbar input,.composer textarea{box-shadow:inset 0 1px 3px rgba(0,0,0,.04)}
.searchbar input:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(51,144,236,.12)}
.inp:focus,.field:focus-within{box-shadow:0 0 0 3px rgba(51,144,236,.12)}

/* пузыри сообщений */
.bub{border:1px solid rgba(0,0,0,.03);border-radius:16px 16px 16px 5px;box-shadow:0 2px 9px rgba(16,36,56,.06)}
.bub.mine{border-radius:16px 16px 5px 16px;background:linear-gradient(135deg,var(--b),#4facfe);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(51,144,236,.22)}
.bub.mine .tm{color:rgba(255,255,255,.82)}
.bub.mine .checks{color:rgba(255,255,255,.95)}
.rx{background:rgba(120,130,145,.16);border:1px solid transparent;transition:transform .15s,background .15s}
.rx:active{transform:scale(1.15)}
.rx.on{background:var(--b);color:#fff;border-color:transparent}
.date span{background:rgba(120,130,145,.18);backdrop-filter:blur(6px)}

/* поле ввода и кнопка отправки */
.composer textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(51,144,236,.12)}
.send{background:linear-gradient(135deg,var(--b),var(--b2));box-shadow:0 4px 13px rgba(51,144,236,.38);transition:transform .15s,box-shadow .2s}
.send:active{transform:scale(.9)}
.fab{box-shadow:0 8px 22px rgba(51,144,236,.45)}

/* модальные окна */
.overlay{animation:fadeIn .18s ease}
.sheet{animation:slideUp .28s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
.toast{animation:toastIn .25s cubic-bezier(.2,.9,.3,1)}
@keyframes toastIn{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* индикатор набора текста */
.typing-dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:4px}
.typing-dots i{width:5px;height:5px;border-radius:50%;background:var(--b);animation:dots 1.2s infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}
.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* тёмная тема и AMOLED остаются полностью чёрными */
html[data-theme="dark"] .center,html[data-theme="amoled"] .center{background:#000!important}
html[data-theme="dark"] .center::before,html[data-theme="dark"] .center::after,html[data-theme="amoled"] .center::before,html[data-theme="amoled"] .center::after{display:none}
html[data-theme="amoled"] .msgs{background-image:none!important}
html[data-theme="amoled"] .bub.mine{background:#001522!important}
html[data-theme="amoled"] .card,html[data-theme="amoled"] .bub,html[data-theme="amoled"] .topbar,html[data-theme="amoled"] .tabbar,html[data-theme="amoled"] .chat-head{box-shadow:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ STATE ============ */
const BASE = atob('aHR0cHM6Ly9jaGF0LW1hbmFnZXIucmVpZmx5MjMxLndvcmtlcnMuZGV2');
let token = localStorage.getItem('chat_token') || '';
let me = null, socket = null;
let chats = [], active = null, messages = [], online = [], users = [];
let unread = {}, tab = localStorage.getItem('chat_tab') || 'chats', search = '', theme = localStorage.getItem('chat_theme') || 'light';
let savedChatId = localStorage.getItem('chat_active');
let replyTo = null, chatSearch = false, chatSearchQ = '';
const app = document.getElementById('app');

document.documentElement.dataset.theme = theme;

/* Единый набор SVG-иконок */
const S = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  chat: S('<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 21l1.9-4.5A8.4 8.4 0 0 1 4 11.5a8.5 8.5 0 0 1 17 0z"/>'),
  people: S('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>'),
  gear: S('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 2-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21h-3v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2-2 .1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H5v-3h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-2 .1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5h3v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2 2-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v3h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  pencil: S('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
  back: S('<path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>'),
  search: S('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>'),
  more: S('<circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/>'),
  smile: S('<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01"/><path d="M15 9h.01"/>'),
  send: S('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'),
  plus: S('<path d="M12 5v14"/><path d="M5 12h14"/>'),
  close: S('<path d="M18 6L6 18"/><path d="M6 6l12 12"/>'),
  star: S('<path d="M12 2l3 6.5 7 1-5 5 1.2 7L12 18l-6.2 3.5L7 14.5 2 9.5l7-1z"/>'),

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const hhmm = t => (t || '').slice(11, 16);
const todayKey = t => (t || '').slice(0, 10);

function deviceName(){
  const ua = navigator.userAgent || '';
  let os = 'Устройство';
  if (/Android/i.test(ua)) os = 'Android';
  else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Mac OS X/i.test(ua)) os = 'macOS';
  else if (/Linux/i.test(ua)) os = 'Linux';
  let br = 'Браузер';
  if (/Edg\//.test(ua)) br = 'Edge';
  else if (/OPR\//.test(ua)) br = 'Opera';
  else if (/Chrome\//.test(ua)) br = 'Chrome';
  else if (/Firefox\//.test(ua)) br = 'Firefox';
  else if (/Safari\//.test(ua)) br = 'Safari';
  return br + ' · ' + os;
}

function notify(text){
  const old = document.getElementById('toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'toast';
  el.className = 'toast';
  el.textContent = text;
  el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 15px;border-radius:20px;font-size:13px;z-index:99;max-width:80%;text-align:center';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, opts = {}){
  const res = await fetch(BASE + '/api' + path, {
    ...opts,
    headers: {'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {}), ...(opts.headers || {})}
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Ошибка сети');
  return data;
}

let authMode = localStorage.getItem('chat_last_user') ? 'login' : 'register';
let showPass = false;
let pendingUser = localStorage.getItem('chat_last_user') || '';
let pendingPass = '';
function authScreen(err = ''){
  app.innerHTML = `<div class="center"><form class="auth-box card" id="authForm">
    <div class="logo">${I.chat}</div><h1>Chat Manager</h1>
    <div class="tabs">
      <button type="button" id="tReg" class="${authMode==='register'?'on':''}">Регистрация</button>
      <button type="button" id="tLog" class="${authMode==='login'?'on':''}">Вход</button>
    </div>
    <div class="field"><span>@</span><input id="u" placeholder="юзернейм" autocomplete="username" maxlength="32" value="${esc(pendingUser)}"></div>
    <div class="field"><input id="p" type="${showPass?'text':'password'}" placeholder="Пароль (от 6 символов)" autocomplete="current-password" value="${esc(pendingPass)}"><button type="button" class="eye" id="eye">${showPass?'🙈':'👁'}</button></div>
    ${authMode==='register' ? '<div class="field"><input id="p2" type="password" placeholder="Повторите пароль" autocomplete="new-password"></div>' : ''}
    <div class="hint" style="margin:2px 0 6px">5–32 символа: латиница, цифры, _</div>
    ${authMode==='register' ? '<div class="hint" style="margin:0 0 10px;color:var(--b)">Уже есть аккаунт? Нажмите «Вход» сверху.</div>' : ''}
    <div class="err">${esc(err)}</div>
    <button class="btn" type="submit" id="go">${authMode==='register'?'Создать аккаунт':'Войти'}</button>
    <div style="text-align:center;display:flex;flex-direction:column;gap:6px">
      ${authMode==='login' ? '<button type="button" class="link" id="forgotBtn">Забыли пароль?</button>' : ''}
    </div>
  </form></div>`;
  document.getElementById('tReg').onclick = () => { authMode='register'; authScreen(); };
  document.getElementById('tLog').onclick = () => { authMode='login'; authScreen(); };
  document.getElementById('eye').onclick = () => { showPass=!showPass; authScreen(); };
  const forgot = document.getElementById('forgotBtn');
  if (forgot) forgot.onclick = () => recoverySheet();
  document.getElementById('authForm').onsubmit = async e => {
    e.preventDefault();
    const username = document.getElementById('u').value.trim();
    const password = document.getElementById('p').value;
    pendingUser = username; pendingPass = password;
    if (authMode==='register' && password !== document.getElementById('p2').value)
      return authScreen('Пароли не совпадают');
    try {
      const data = await api('/' + authMode, {method:'POST', body:JSON.stringify({username,password,device:deviceName()})});
      token = data.token; me = data.user;
      pendingPass = '';
      localStorage.setItem('chat_token', token);
      localStorage.setItem('chat_last_user', data.user.username);
      if (authMode === 'register' && data.recoveryCode) return showRecoveryOnce(data.recoveryCode);
      start();
    } catch(err) {
      // Аккаунт уже есть — это вход с другого устройства, переключаем на «Вход»
      if (authMode === 'register' && /занят/i.test(err.message)) {
        authMode = 'login';
        return authScreen('Этот юзернейм уже существует. Введите пароль и нажмите «Войти» — данные сохранены.');
      }
      authScreen(err.message);
    }
  };
}

async function searchPeople(q){

    el.innerHTML = '<div class="hint" style="text-align:center;padding:30px">Введите минимум 2 символа юзернейма</div>';

  }
  el.innerHTML = '<div class="hint" style="text-align:center;padding:20px">Ищем...</div>';

  catch(e) { el.innerHTML = `<div class="hint" style="text-align:center;padding:20px">${esc(e.message)}</div>`; return; }
  el.innerHTML = users.length ? users.map(u => `
    <button class="row" data-id="${u.id}">

    </button>`).join('') : '<div class="hint" style="text-align:center;padding:30px">Никого не найдено</div>';
  el.querySelectorAll('.row').forEach(b => b.onclick = async () => {
    const u = users.find(x => x.id == b.dataset.id);
    const exists = chats.find(c => !c.is_group && c.name === '@' + u.username);

/* ============ ОКНО ЧАТА ============ */
function dateLabel(ts){
  const k = todayKey(ts);
  const now = new Date().toISOString().slice(0,10);
  if (k === now) return 'Сегодня';
  const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (k === y) return 'Вчера';
  return k;
}

function reactionsHtml(m){
  let r = {};
  try { r = JSON.parse(m.reactions || '{}'); } catch {}
  const keys = Object.keys(r);
  if (!keys.length) return '';
  return `<div class="reactions">${keys.map(e =>
    `<button class="rx ${r[e].includes(me.id)?'on':''}" data-react="${esc(e)}" data-mid="${m.id}">${e} ${r[e].length}</button>`
  ).join('')}</div>`;
}

function msgHtml(m){
  const mine = m.user_id === me.id;
  const name = m.display_name || m.username;
  const reply = m.reply_to
    ? `<div class="reply"><div class="ra">@${esc(m.reply_username||'')}</div><div class="rt">${esc(m.reply_text||'')}</div></div>` : '';
  const text = m.deleted ? '<i>сообщение удалено</i>' : esc(m.text);
  const check = mine ? `<span class="checks ${(active?.read_id||0) >= m.id ? 'read' : ''}">✓✓</span>` : '';
  return `<div class="bub ${mine?'mine':''} ${m.deleted?'del':''}" data-mid="${m.id}">
    ${reply}
    ${mine?'':`<div class="au" style="color:${esc(m.avatar_color||'#3390ec')}">@${esc(name)}</div>`}
    <div class="tx">${text}</div>
    ${reactionsHtml(m)}
    <div class="tm">${m.edited?'изм. ':''}${hhmm(m.created_at)} ${check}</div>
  </div>`;
}

function paintMessages(){
  const box = document.getElementById('msgs');
  if (!box) return;
  let html = '', lastDate = '';
  for (const m of messages) {
    const d = dateLabel(m.created_at);
    if (d !== lastDate) { html += `<div class="date"><span>${esc(d)}</span></div>`; lastDate = d; }
    html += msgHtml(m);
  }
  box.innerHTML = html || '<div class="hint" style="text-align:center;margin-top:40px">Начните общение 👋</div>';
  box.scrollTop = box.scrollHeight;

  box.querySelectorAll('.bub').forEach(el => {
    const id = Number(el.dataset.mid);
    let timer = null;
    el.addEventListener('touchstart', () => { timer = setTimeout(() => openMsgMenu(id), 500); }, {passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev => el.addEventListener(ev, () => clearTimeout(timer), {passive:true}));
    el.addEventListener('contextmenu', e => { e.preventDefault(); openMsgMenu(id); });
  });
  box.querySelectorAll('[data-react]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    reactMsg(Number(b.dataset.mid), b.dataset.react);
  });
}

async function openChat(chat){
  if (!chat) return;
  active = chat;

  replyTo = null; chatSearch = false;
  try { messages = await api(`/chats/${chat.id}/messages`); }
  catch(e) { return notify(e.message); }
  const lastId = messages.length ? messages[messages.length - 1].id : 0;
  api(`/chats/${chat.id}/read`, {method:'POST', body:JSON.stringify({lastMessageId:lastId})}).catch(()=>{});
  app.innerHTML = `<div class="chat">
    <div class="chat-head">
      <button class="iconbtn" id="back">${I.back}</button>
      <div class="avatar sm">${chat.is_group?'👥':initial(chat.name)}</div>
      <div style="flex:1;min-width:0"><div class="nm">${esc(chat.name)}</div><div class="st" id="status">${chat.members_count||1} участник(ов)</div></div>
      <button class="iconbtn" id="searchMsg">${I.search}</button>
      <button class="iconbtn" id="more">${I.more}</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="typing-bubble" id="typing"></div>
    <div id="emojiBox"></div>
    <form class="composer" id="form">
      <button type="button" class="emoji" id="emojiBtn">${I.smile}</button>
      <textarea id="txt" rows="1" placeholder="Сообщение..." maxlength="2000"></textarea>
      <button class="send" type="submit" id="send">${I.send}</button>
    </form>
  </div>`;
  paintMessages();
  document.getElementById('back').onclick = () => {
    active=null; localStorage.removeItem('chat_active'); shell();
  };
  document.getElementById('more').onclick = () => chatMenuSheet(chat);
  document.getElementById('searchMsg').onclick = () => messageSearchSheet(chat);

  const txt = document.getElementById('txt');
  const send = document.getElementById('send');
  let typingTimer = null;
  txt.oninput = () => {
    txt.style.height = 'auto';
    txt.style.height = Math.min(txt.scrollHeight, 100) + 'px';
    send.disabled = !txt.value.trim();
    socket?.send(JSON.stringify({type:'typing', chatId:chat.id, isTyping:true}));
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => socket?.send(JSON.stringify({type:'typing', chatId:chat.id, isTyping:false})), 1500);
  };
  document.getElementById('form').onsubmit = async e => {
    e.preventDefault();
    const text = txt.value.trim();
    if (!text) return;
    txt.value = ''; txt.style.height = 'auto'; send.disabled = true;
    clearTimeout(typingTimer);
    socket?.send(JSON.stringify({type:'typing', chatId:chat.id, isTyping:false}));
    const withReply = replyTo;
    replyTo = null;
    document.getElementById('replyBar')?.remove();

    emojiBox.innerHTML = emojiBox.innerHTML ? '' : `<div class="emoji-panel">${emojis.map(x=>`<button type="button">${x}</button>`).join('')}</div>`;
    emojiBox.querySelectorAll('button').forEach(b => b.onclick = () => {
      txt.value += b.textContent; txt.oninput(); txt.focus();
    });
  };
  send.disabled = true;
}

function addMessage(m){
  if (messages.some(x => x.id === m.id)) return;
  messages.push(m);
  paintMessages();
  chats = [{...active, last_message:m.text, last_time:m.created_at, last_id:m.id, read_id:active.read_id||0}, ...chats.filter(c=>c.id!==active.id)];
  if (tab !== 'chats' || !active || active.id !== m.chat_id) unread[m.chat_id] = (unread[m.chat_id]||0) + 1;
}

/* ============ ЗАГРУЗКА И WEBSOCKET ============ */
async function loadChats(){
  try {
    chats = await api('/chats');
    unread = {};
    chats.forEach(c => { if ((c.last_id || 0) > (c.read_id || 0)) unread[c.id] = c.last_id - c.read_id; });
    // Возвращаемся в последний открытый чат после перезапуска приложения
    if (savedChatId && !active) {
      const last = chats.find(c => c.id == savedChatId);
      savedChatId = null;
      if (last) { localStorage.removeItem('chat_active'); return openChat(last); }
    }
    if (tab==='chats') paintChats();
  } catch(e) { notify(e.message); }
}

function connectSocket(){
  const base = BASE || location.origin;
  socket = new WebSocket(base.replace(/^http/, 'ws') + '/ws?token=' + encodeURIComponent(token));
  socket.onopen = () => {};
  socket.onclose = () => { setTimeout(() => { if (token) connectSocket(); }, 3000); };
  socket.onmessage = e => {
    let d;
    try { d = JSON.parse(e.data); } catch { return; }
    if (d.type === 'users:online') { online = d.ids; if (tab==='people') renderPeople(); }
    if (d.type === 'message:new') {
      const m = d.message;
      if (active && m.chat_id === active.id) addMessage(m);
      else {
        chats = [{...chats.find(c=>c.id===m.chat_id), last_message:m.text, last_time:m.created_at}, ...chats.filter(c=>c.id!==m.chat_id)].filter(Boolean);
        unread[m.chat_id] = (unread[m.chat_id]||0)+1;
        if (tab==='chats') paintChats();
      }
    }
    if (d.type === 'typing') {
      if (d.chatId && active && d.chatId !== active.id) return;
      const el = document.getElementById('typing');
      const st = document.getElementById('status');
      if (el) el.innerHTML = d.isTyping
        ? `<span class="typing-dots"><i></i><i></i><i></i></span>${esc(d.username)} печатает…`
        : '';
      if (st && !d.isTyping) st.textContent = `${active?.members_count||1} участник(ов)`;
    }
    if (d.type === 'message:edited' || d.type === 'reaction:new') {
      if (active && d.message.chat_id === active.id) replaceMessage(d.message);
      else loadChats();
    }
    if (d.type === 'message:deleted') {
      if (active && d.chatId === active.id) {
        const m = messages.find(x => x.id === d.id);
        if (m) { m.deleted = 1; m.text = ''; paintMessages(); }
      }
    }
    if (d.type === 'read:update') {
      chats = chats.map(c => c.id === d.chatId ? {...c, read_id: Math.max(c.read_id||0, d.lastMessageId||0)} : c);
      if (active && active.id === d.chatId) { active.read_id = d.lastMessageId; paintMessages(); }
      if (tab==='chats') paintChats();
    }
    if (d.type === 'profile:updated' && d.user.id === me?.id) me = d.user;
  };
}

function start(){ shell(); loadChats(); connectSocket(); }

function splash(text){
  app.innerHTML = `<div class="center"><div style="text-align:center">
    <div class="logo">${I.chat}</div><div class="hint" style="margin-top:10px">${esc(text)}</div>
  </div></div>`;
}

function offlineScreen(msg){
  app.innerHTML = `<div class="center"><form class="auth-box card" id="offForm" style="text-align:center">
    <div class="logo">📶</div><h1 style="font-size:18px">Нет связи с сервером</h1>
    <div class="hint" style="margin-bottom:14px">Сессия сохранена на устройстве. Проверьте интернет и попробуйте снова.</div>
    <div class="err">${esc(msg||'')}</div>
    <button class="btn" type="submit">Повторить</button>
    <button type="button" class="link" id="offLogout">Выйти из аккаунта</button>
  </form></div>`;
  document.getElementById('offForm').onsubmit = e => { e.preventDefault(); render(); };
  document.getElementById('offLogout').onclick = () => {
    token=''; me=null;
    ['chat_token','chat_active','chat_tab'].forEach(k => localStorage.removeItem(k));
    authScreen();
  };
}

function render(){
  if (!token) return authScreen();
  if (!me) {
    splash('Восстанавливаем сессию...');
    api('/me').then(u => {
      me = u;
      localStorage.setItem('chat_last_user', u.username);
      start();
    }).catch(err => {
      const msg = String(err?.message || '');
      // Сеть недоступна — сохраняем токен и даём повторить позже
      if (/Failed to fetch|Network|Ошибка сети|timeout|Timeout/i.test(msg)) return offlineScreen(msg);
      token=''; localStorage.removeItem('chat_token'); authScreen();
    });
    return;
  }
  start();
}

render();
</script>
</body>
</html>
