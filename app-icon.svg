<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#4338a8"/>
      <stop offset="45%" stop-color="#251b63"/>
      <stop offset="100%" stop-color="#090817"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#b9ecff"/>
      <stop offset="100%" stop-color="#68a8ff"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2b5fd9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="#a99bff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- орбита -->
  <ellipse cx="256" cy="256" rx="190" ry="86" fill="none" stroke="#9b8cff" stroke-opacity="0.28" stroke-width="3"
           transform="rotate(-22 256 256)"/>

  <!-- звёзды -->
  <g fill="#dcd6ff">
    <circle cx="96" cy="120" r="3.5" opacity="0.9"/>
    <circle cx="420" cy="112" r="4.5" opacity="0.8"/>
    <circle cx="398" cy="404" r="3" opacity="0.75"/>
    <circle cx="110" cy="392" r="4" opacity="0.85"/>
    <circle cx="256" cy="72" r="2.5" opacity="0.7"/>
    <circle cx="64" cy="268" r="2.5" opacity="0.6"/>
  </g>
  <g fill="#fff">
    <path d="M92 196l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity="0.85"/>
    <path d="M432 300l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity="0.7"/>
    <path d="M300 430l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity="0.6"/>
  </g>

  <!-- симметричный бумажный самолёт, повёрнут на 90 градусов -->
  <g transform="rotate(90 256 256)">
    <g filter="url(#glow)">
      <path d="M256 120 L410 322 L300 368 L256 282 L212 368 L102 322 Z" fill="url(#plane)"/>
      <!-- левое крыло -->
      <path d="M256 120 L102 322 L256 282 Z" fill="url(#plane)"/>
      <!-- правое крыло -->
      <path d="M256 120 L410 322 L256 282 Z" fill="url(#fold)"/>
      <!-- левый закрылок -->
      <path d="M102 322 L212 368 L256 282 Z" fill="#cfe9ff"/>
      <!-- правый закрылок -->
      <path d="M256 282 L300 368 L410 322 Z" fill="#9fd0ff"/>
    </g>
    <!-- центральная складка -->
    <path d="M256 120 L256 282" stroke="#fff" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- хвостик-сообщение -->
  <circle cx="356" cy="176" r="9" fill="#6f61e8"/>
  <circle cx="332" cy="200" r="6" fill="#6f61e8" opacity="0.7"/>
</svg>
