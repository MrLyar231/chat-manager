services:
  - type: web
    name: chat-manager
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_PATH
        value: /data/chat.db
      - key: CLIENT_DIST
        value: ./public
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: chat-data
      mountPath: /data
      sizeGB: 1
